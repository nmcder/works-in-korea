name: report-poll

# 공개 레포(제보 창구)의 이슈를 읽어 와 데이터에 반영하고 PR을 연다.
#
# 왜 폴링인가: 제보 폼은 공개 레포에 있고 측정 데이터는 이 프라이빗 레포에 있다.
# 다른 레포의 이벤트로는 이 레포의 워크플로가 켜지지 않으므로 주기적으로 읽어 온다.
# 공개 레포의 이슈는 인증 없이 읽을 수 있어서 토큰이 없어도 동작한다.
on:
  schedule:
    # 6시간마다. 하나는 측정 크론(18:00 UTC) 직후에 오도록 맞췄다.
    #
    # 하루 한 번이었을 때 문제: 제보가 들어오고 수집되기까지 최대 24시간 동안
    # 이슈가 그 제보의 **유일한 사본**이다. 그 사이에 이슈가 사라지면 제보도 사라진다.
    # 2026-08-16 에 시험 이슈를 지웠다가 실제로 그렇게 됐다.
    # 6시간으로 줄이면 공백이 1/4이 되고, Actions 사용량은 월 120분 늘어난다
    # (무료 2,000분 중. 측정 크론이 이미 250분을 쓴다).
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 처리한 이슈도 다시 처리'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: report-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 공개 제보 레포. Settings → Variables 에 REPORTS_REPO 를 넣으면 그것을 쓴다.
      REPORTS_REPO: ${{ vars.REPORTS_REPO }}
      # 답글용 토큰(선택). secrets 컨텍스트는 스텝의 if 에서 읽을 수 없으므로
      # 여기서 env 로 옮겨 둔다. 없으면 답글 단계만 건너뛴다.
      REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
    steps:
      # 설정이 없으면 조용히 초록불로 끝나면 안 된다. 그러면 제보 레이어가 죽은 채로
      # 몇 주가 지나도 아무도 모른다. 빨간 X 와 함께 무엇을 해야 하는지 화면에 적는다.
      - name: 제보 레포가 설정됐는지 확인
        run: |
          if [ -z "$REPORTS_REPO" ]; then
            {
              echo "## ❌ 제보를 가져오지 못했습니다"
              echo ""
              echo "\`REPORTS_REPO\` 저장소 변수가 비어 있어 아무 일도 하지 않았습니다."
              echo ""
              echo "**고치는 법** — 이 저장소(works-in-korea, 비공개)에서:"
              echo ""
              echo "1. **Settings** → **Secrets and variables** → **Actions**"
              echo "2. 위쪽 **Variables** 탭 (Secrets 탭 아님 — 흔한 실수입니다)"
              echo "3. **New repository variable**"
              echo "   - Name: \`REPORTS_REPO\`"
              echo "   - Value: \`nmcder/works-in-korea-reports\`"
              echo "4. 이 워크플로를 다시 실행"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::REPORTS_REPO 변수가 비어 있다. Settings → Secrets and variables → Actions → Variables 탭에 추가할 것."
            exit 1
          fi
          echo "제보 레포: $REPORTS_REPO"

      - uses: actions/checkout@v7
        if: env.REPORTS_REPO != ''

      - uses: actions/setup-node@v7
        if: env.REPORTS_REPO != ''
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: env.REPORTS_REPO != ''

      - name: 공개 레포에서 제보 이슈 받아오기
        if: env.REPORTS_REPO != ''
        run: |
          # 공개 레포의 이슈는 인증 없이 읽힌다. 하루 1회라 rate limit 여유가 크다.
          curl -sS --fail-with-body \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPORTS_REPO}/issues?labels=report&state=all&per_page=100" \
            -o issues.json
          # 요약 단계에서 다시 읽으려 하면 안 된다 — PR 단계가 issues.json 을 지운다.
          # 지금 세어서 환경변수에 넣어 둔다.
          echo "TOTAL=$(node -e 'const a=require("./issues.json");console.log(Array.isArray(a)?a.length:0)')" >> "$GITHUB_ENV"
          echo "BEFORE=$(ls data/reports 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
          node -e 'const a=require("./issues.json");console.log("받은 이슈",Array.isArray(a)?a.length:0,"건")'

      - name: 제보 처리
        if: env.REPORTS_REPO != ''
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm run ingest -- --issues=issues.json --force
          else
            npm run ingest -- --issues=issues.json
          fi

      - name: 스키마 검증 (깨진 데이터가 PR로 나가지 않게)
        if: env.REPORTS_REPO != ''
        run: npm run validate

      - name: 제보자에게 답글 (선택 — REPORTS_TOKEN 이 있을 때만)
        if: env.REPORTS_REPO != '' && env.REPORTS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: |
          shopt -s nullglob
          for f in .report-comments/*.md; do
            n=$(basename "$f" .md)
            gh issue comment "$n" --repo "$REPORTS_REPO" --body-file "$f" || \
              echo "::warning::#$n 댓글 실패 (토큰 권한 확인)"
          done

      - name: 변경이 있으면 PR
        if: env.REPORTS_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f issues.json
          rm -rf .report-comments
          if [ -z "$(git status --porcelain)" ]; then
            echo "새 제보로 인한 데이터 변경 없음 — PR 생략"
            exit 0
          fi

          BRANCH="reports/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "works-in-korea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "report: 커뮤니티 제보 반영 ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "커뮤니티 제보 반영 ($(date -u +%Y-%m-%d))" \
            --body "$(printf '%s\n' \
              "공개 레포(\`${REPORTS_REPO}\`)의 제보를 데이터에 반영하는 PR입니다." \
              "" \
              "**승인 전에 확인할 것**" \
              "- [ ] \`data/reports/\` 에 개인정보가 들어 있지 않은가" \
              "- [ ] status 가 \`rejected\` 인 제보가 있으면, 공개 레포의 해당 이슈를 **삭제**했는가" \
              "      (우리가 저장하지 않았을 뿐 이슈 본문은 여전히 공개 상태다)" \
              "- [ ] 제보 내용과 기록된 값이 일치하는가" \
              "- [ ] 자동 측정값과 모순되면 \`conflicting\` 으로 남았는가")" \
            --base main \
            --head "$BRANCH"

      # 매 실행마다 "무슨 일이 있었는지"를 한 화면에 남긴다.
      # 로그를 뒤지지 않고도 상태를 알 수 있어야 한다.
      - name: 실행 요약
        if: always() && env.REPORTS_REPO != ''
        run: |
          TOTAL=${TOTAL:-0}
          AFTER=$(ls data/reports 2>/dev/null | wc -l)
          NEW=$(( AFTER - ${BEFORE:-0} ))
          {
            echo "## 제보 수집 결과"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 제보 저장소 | \`$REPORTS_REPO\` |"
            echo "| 가져온 이슈 | ${TOTAL}건 |"
            echo "| 새로 처리 | ${NEW}건 |"
            echo "| 누적 제보 | ${AFTER}건 |"
            echo ""
            if [ "$TOTAL" = "0" ]; then
              echo "공개 저장소에 \`report\` 라벨이 붙은 이슈가 아직 없습니다."
              echo "폼으로 제보가 하나라도 들어오면 여기에 잡힙니다."
            elif [ "$NEW" = "0" ]; then
              echo "새 제보가 없습니다 (가져온 이슈는 모두 이전에 처리됨). PR을 만들지 않았습니다."
            else
              echo "새 제보 ${NEW}건을 처리했습니다. 데이터가 바뀌었으면 위에 PR이 열려 있습니다."
              echo "**PR을 승인해야 사이트에 반영됩니다.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
