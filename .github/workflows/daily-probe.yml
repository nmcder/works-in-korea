name: daily-probe

# 하루 1회 측정 (크롤링 예의: 저빈도). UTC 18:00 = KST 03:00
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '특정 서비스만 (쉼표 구분, 예: coupang,toss). 비우면 전체'
        required: false
        default: ''
      limit:
        description: '앞에서 N개만 측정 (테스트용). 비우면 전체'
        required: false
        default: ''
      signals:
        description: '특정 시그널만 (쉼표 구분). 비우면 6종 전부'
        required: false
        default: ''

permissions:
  contents: write

# 측정이 겹치면 같은 사이트에 두 배로 요청이 나간다. 절대 동시 실행하지 않는다.
concurrency:
  group: daily-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WIK_PROJECT_URL: ${{ vars.WIK_PROJECT_URL }}
      WIK_CONTACT: ${{ vars.WIK_CONTACT }}
      WIK_LLM_MODEL: ${{ vars.WIK_LLM_MODEL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 측정 실행
        # 입력값은 셸에 직접 넣지 않고 env를 거친다 (스크립트 인젝션 방지)
        env:
          IN_ONLY: ${{ github.event.inputs.only }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_SIGNALS: ${{ github.event.inputs.signals }}
        run: |
          ARGS=()
          if [ -n "$IN_ONLY" ];    then ARGS+=("--only=$IN_ONLY"); fi
          if [ -n "$IN_LIMIT" ];   then ARGS+=("--limit=$IN_LIMIT"); fi
          if [ -n "$IN_SIGNALS" ]; then ARGS+=("--signals=$IN_SIGNALS"); fi
          npm run probe -- "${ARGS[@]}"

      - name: 스키마 검증
        run: npm run validate

      - name: 결과 커밋
        run: |
          git config user.name  "works-in-korea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          CHANGED=$(node -e "
            const fs=require('fs');
            const d=new Date().toISOString().slice(0,10);
            try{ console.log(JSON.parse(fs.readFileSync('data/changes/'+d+'.json','utf8')).changes.length); }
            catch{ console.log(0); }
          ")
          git commit -m "measure: $(date -u +%Y-%m-%d) (값 변경 ${CHANGED}건)"
          git push

      - name: 실행 요약
        if: always()
        run: |
          echo "### 측정 요약" >> $GITHUB_STEP_SUMMARY
          if [ -f data/runs/latest.json ]; then
            node -e "
              const s = require('./data/runs/latest.json');
              const out = [
                '- 측정 지점: ' + s.vantage_point.country + ' (' + (s.vantage_point.region ?? '-') + ')',
                '- 서비스: ' + s.services_probed + ' / ' + s.services_total,
                '- 측정 성공: ' + s.signals_measured + ' · unknown: ' + s.signals_unknown,
                '- 값 변경: ' + s.changes + '건',
                '- 오류: ' + s.errors.length + '건',
                '- 소요: ' + (s.duration_ms/1000).toFixed(0) + '초',
              ];
              // 돈이 나가는 유일한 곳. 자동 충전을 꺼 두려면 새는 것을 알아챌 수 있어야 한다.
              // cached 가 calls 보다 크게 유지되는 것이 정상이고, 뒤집히면 캐시가 깨진 것이다.
              const l = s.llm;
              if (l && (l.calls > 0 || l.cached > 0)) {
                const price = { 'claude-sonnet-5': [3, 15], 'claude-haiku-4-5': [1, 5] }[l.model] ?? [3, 15];
                const usd = (l.input_tokens / 1e6) * price[0] + (l.output_tokens / 1e6) * price[1];
                out.push(
                  '- LLM: 호출 ' + l.calls + '건 · 캐시로 생략 ' + l.cached + '건',
                  '- LLM 토큰: 입력 ' + l.input_tokens.toLocaleString() + ' · 출력 ' + l.output_tokens.toLocaleString(),
                  '- 이번 실행 비용: 약 $' + usd.toFixed(3) + (l.model ? ' (' + l.model + ')' : ''),
                );
                if (l.calls > l.cached && l.cached > 0) {
                  out.push('- ⚠️ 캐시보다 호출이 많다. 재분류가 계속 일어나는지 확인할 것.');
                }
              }
              console.log(out.join('\n'));
            " >> $GITHUB_STEP_SUMMARY
          fi
